<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinyReact — Router Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    
    .navbar {
      background: #1a1a2e; color: white; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { font-weight: bold; font-size: 18px; color: white; text-decoration: none; }
    .nav-links a { color: #aaa; text-decoration: none; margin-left: 20px; font-size: 14px; }
    .nav-links a:hover { color: white; }

    .main-content { max-width: 640px; margin: 40px auto; padding: 0 20px; }
    .page h1 { margin-bottom: 16px; }
    .page p { margin-bottom: 12px; line-height: 1.6; }
    .page ul { margin: 12px 0 12px 24px; }
    .page li { margin-bottom: 8px; }

    .card {
      background: white; border-radius: 8px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin: 16px 0;
    }
    .card h3 { margin-bottom: 12px; }
    .card ul { list-style: none; margin-left: 0; }
    .card a { color: #4a90d9; text-decoration: none; }
    .card a:hover { text-decoration: underline; }

    .user-list { list-style: none; margin-left: 0; }
    .user-list li { padding: 10px 16px; background: white; margin-bottom: 4px; border-radius: 4px; }
    .user-list a { color: #4a90d9; text-decoration: none; font-weight: 500; }
    .user-list a:hover { text-decoration: underline; }

    a { color: #4a90d9; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .counter-card { text-align: center; }
    .count { font-size: 64px; font-weight: bold; margin: 20px 0; }
    .counter-buttons button {
      font-size: 20px; padding: 8px 24px; margin: 0 8px;
      border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;
    }
    .counter-buttons button:hover { background: #f0f0f0; }
    .route-info { color: #888; font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="tinyreact.js"></script>
  <script src="router-app.js"></script>
</body>
</html>
